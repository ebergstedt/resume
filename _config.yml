about_content: | # this will include new lines to allow paragraphs
  As a Solutions Architect I take responsibility for driving your company vision forward, from business strategy down to concrete implementation. I enjoy improving code stability and performance through long-term, cost-efficient architectural choices, and enabling other developers to build the best product they can as a team lead.

  I have over 15 years of experience with a wide breadth of knowledge, including but not limited to:
  * .NET architecture and design
  * Distributed systems and event-driven microservices
  * Cloud architecture (Azure, AWS, Google Cloud)
  * API design and implementation
  * Full-stack web development
  * Database design and optimization (relational, NoSQL, hybrid)
  * DevOps and platform engineering (Kubernetes, Docker, CI/CD, release automation, infrastructure as code, monitoring)
  * Languages: C#, Python, SQL, F#, Java, JavaScript

